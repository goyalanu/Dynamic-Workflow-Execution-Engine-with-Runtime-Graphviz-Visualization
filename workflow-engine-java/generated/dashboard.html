<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow Runtime Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #17202a;
    }
    body {
      margin: 0;
    }
    header {
      padding: 28px 32px 18px;
      border-bottom: 1px solid #d8dee7;
      background: #ffffff;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
    }
    p {
      margin: 0;
      color: #526170;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
      padding: 24px 32px 32px;
    }
    section {
      background: #ffffff;
      border: 1px solid #d8dee7;
      border-radius: 8px;
      overflow: hidden;
    }
    h2 {
      margin: 0;
      padding: 16px 18px;
      font-size: 16px;
      border-bottom: 1px solid #e5e9ef;
    }
    .graph {
      min-height: 280px;
      padding: 18px;
      overflow: auto;
    }
    img {
      display: block;
      max-width: 100%;
      height: auto;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 18px 18px;
      color: #526170;
      font-size: 13px;
    }
    .key {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #a8b3c1;
    }
  </style>
</head>
<body>
  <header>
    <h1>OrderFulfillment Runtime Dashboard</h1>
    <p>Graphs are rendered from runtime state generated by the workflow engine.</p>
  </header>
  <main>
    <section>
      <h2>Successful Run</h2>
      <div class="graph"><img src="success.svg" alt="Successful workflow run graph"></div>
      <div class="legend">
        <span class="key"><span class="swatch" style="background:#8fd19e"></span>Completed</span>
      </div>
    </section>
    <section>
      <h2>Failure Run</h2>
      <div class="graph"><img src="failure.svg" alt="Failed workflow run graph"></div>
      <div class="legend">
        <span class="key"><span class="swatch" style="background:#8fd19e"></span>Completed</span>
        <span class="key"><span class="swatch" style="background:#e27b7b"></span>Failed</span>
        <span class="key"><span class="swatch" style="background:#f5d26b"></span>Blocked</span>
      </div>
    </section>
  </main>
</body>
</html>
