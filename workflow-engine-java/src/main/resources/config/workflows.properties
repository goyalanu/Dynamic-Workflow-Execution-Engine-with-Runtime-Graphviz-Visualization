workflow.name=OrderFulfillment
workflow.description=Configurable order fulfillment workflow.
workflow.failurePolicy=BLOCK_REMAINING
workflow.retry.maxRetries=2
workflow.retry.retryIntervalSeconds=5
workflow.retry.backoff=EXPONENTIAL
workflow.steps=ValidateOrder,ProcessPayment,ReserveInventory,GenerateInvoice,SendNotification
step.ValidateOrder.displayName=Validate Order
step.ValidateOrder.dependencies=
step.ProcessPayment.displayName=Process Payment
step.ProcessPayment.dependencies=ValidateOrder
step.ReserveInventory.displayName=Reserve Inventory
step.ReserveInventory.dependencies=ProcessPayment
step.GenerateInvoice.displayName=Generate Invoice
step.GenerateInvoice.dependencies=ProcessPayment
step.SendNotification.displayName=Send Notification
step.SendNotification.dependencies=ReserveInventory,GenerateInvoice
